name: Offres du jour

on:
  schedule:
    - cron: "0 */3 * * *"   # toutes les 3 heures (7h, 10h, 13h... heure de Paris)
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  offres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les nouvelles offres (Adzuna + France Travail)
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          DEPARTEMENT: ${{ vars.DEPARTEMENT }}
        run: python scripts/recuperer_offres.py 3
      - name: Enregistrer les offres sur le site
        run: |
          git config user.name "robot-offres"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offres.json
          git diff --cached --quiet || git commit -m "Offres du jour $(date +%F)"
          git push
